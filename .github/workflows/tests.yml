name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  ci-scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      pytest_targets_json: ${{ steps.scope.outputs.pytest_targets_json }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select the required test tier
        id: scope
        env:
          DPL_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DPL_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci_test_scope.py

  global-checks:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'focused'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install global-check dependencies
        run: python -m pip install -c requirements/ci-constraints.txt -e ".[dev,plotting]"
      - name: Validate syntax and undefined names
        run: ruff check draftpaper_cli tests tools --select E9,F63,F7,F82
      - name: Validate command, template, schema, and provenance contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m draftpaper_cli.cli validate-command-contracts
          python -m draftpaper_cli.cli validate-template-registry
          python -m draftpaper_cli.cli validate-third-party-provenance
          python -c "from draftpaper_cli.schema_registry import schema_registry_report; assert schema_registry_report()['status'] == 'passed'"
      - name: Scan first-party secrets
        run: python tools/scan_secrets.py

  focused-tests:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'focused'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install focused-test dependencies
        run: python -m pip install -c requirements/ci-constraints.txt -e ".[dev,plotting]"
      - name: Run tests selected for changed files
        env:
          TEST_TARGETS_JSON: ${{ needs.ci-scope.outputs.pytest_targets_json }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          targets = json.loads(os.environ["TEST_TARGETS_JSON"])
          if targets:
              raise SystemExit(subprocess.run([sys.executable, "-m", "pytest", *targets]).returncode)
          print("No component-specific pytest target; global checks still apply.")
          PY

  unit-tests:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Draftpaper-loop
        run: python -m pip install -c requirements/ci-constraints.txt -e .[dev,plotting]
      - name: Run tests
        run: python -m pytest

  wheel-install:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install build dependencies
        run: python -m pip install -c requirements/ci-constraints.txt -e ".[dev,plotting,fulltext]" build
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify isolated wheel resources
        run: python tools/verify_wheel_install.py --wheel-dir dist
      - name: Verify wheel install-profile metadata
        run: python tools/verify_install_matrix.py --wheel-dir dist

  install-profile-smoke:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, plotting, fulltext, mcp, browser]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install selected profile
        shell: bash
        run: |
          if [[ "${{ matrix.profile }}" == "minimal" ]]; then
            target="."
          else
            target=".[${{ matrix.profile }}]"
          fi
          python -m pip install -c requirements/ci-constraints.txt -e "$target"
      - name: Verify selected profile through Doctor
        env:
          DPL_INSTALL_PROFILE: ${{ matrix.profile }}
        run: python -c "import os; from draftpaper_cli.doctor import doctor_project; p=os.environ['DPL_INSTALL_PROFILE']; r=doctor_project(); assert r['environment']['install_profiles']['profiles'][p]['status'] == 'available', r"
      - name: Verify vendored paper-fetch runtime
        if: matrix.profile == 'fulltext'
        run: python -c "from draftpaper_cli.environment_verification import _probe_vendored_paper_fetch_runtime as p; r=p(); assert r['status'] == 'passed', r"

  contracts-and-security:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install quality tools
        run: python -m pip install -c requirements/ci-constraints.txt -e .[dev,plotting]
      - name: Validate syntax and undefined names
        run: ruff check draftpaper_cli tests tools --select E9,F63,F7,F82
      - name: Validate typed transaction core
        run: pyright
      - name: Validate command, plugin, schema, provenance, and release contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m draftpaper_cli.cli validate-command-contracts
          python -m draftpaper_cli.cli validate-template-registry
          python -m draftpaper_cli.cli validate-third-party-provenance
          python -c "from draftpaper_cli.schema_registry import schema_registry_report; assert schema_registry_report()['status'] == 'passed'"
          python -c "from draftpaper_cli.release_contract import validate_release_manifest; assert validate_release_manifest()['status'] == 'passed'"
          python tools/verify_evidence_governance.py --output build/evidence_governance_self_test.json
      - name: Run frozen literature and parser quality benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/benchmarks
          python -m draftpaper_cli.cli benchmark-literature-quality --output build/benchmarks/literature_quality.json
          python -m draftpaper_cli.cli benchmark-document-parsers --output build/benchmarks/document_parser_quality.json
          python -c "import json; assert json.load(open('build/benchmarks/literature_quality.json', encoding='utf-8'))['status'] == 'passed'; assert json.load(open('build/benchmarks/document_parser_quality.json', encoding='utf-8'))['status'] == 'passed'"
      - name: Validate agent skill copy parity (Claude Code / Codex)
        run: |
          python -m pytest tests/test_claude_code_compat.py -q
          python tools/setup_claude_code.py --check
      - name: Scan first-party secrets
        run: python tools/scan_secrets.py
      - name: Audit installed dependencies
        shell: bash
        run: |
          mkdir -p build/security
          python -m pip_audit . --format cyclonedx-json --output build/security/sbom.json
          python -c "import json; p=json.load(open('build/security/sbom.json', encoding='utf-8')); assert p.get('components')"

  coverage:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Draftpaper-loop
        run: python -m pip install -c requirements/ci-constraints.txt -e .[dev,plotting]
      - name: Measure first-party coverage
        run: python -m pytest --cov=draftpaper_cli --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=65

  macos-smoke:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Draftpaper-loop plotting test profile
        run: python -m pip install -c requirements/ci-constraints.txt -e .[dev,plotting]
      - name: Run macOS control-plane smoke
        run: python -m pytest -q tests/test_command_contracts_v029.py tests/test_v0316_install_profiles.py tests/test_v0317_readme_and_cli_reference.py tests/test_v0318_cost_risk_product_docs.py tests/test_v0319_cross_platform_release.py

  ci-result:
    name: CI result (required)
    if: always()
    needs:
      - ci-scope
      - global-checks
      - focused-tests
      - unit-tests
      - wheel-install
      - install-profile-smoke
      - contracts-and-security
      - coverage
      - macos-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks for the selected tier
        env:
          MODE: ${{ needs.ci-scope.outputs.mode }}
          SCOPE_RESULT: ${{ needs.ci-scope.result }}
          GLOBAL_RESULT: ${{ needs.global-checks.result }}
          FOCUSED_RESULT: ${{ needs.focused-tests.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          WHEEL_RESULT: ${{ needs.wheel-install.result }}
          PROFILE_RESULT: ${{ needs.install-profile-smoke.result }}
          SECURITY_RESULT: ${{ needs.contracts-and-security.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          MACOS_RESULT: ${{ needs.macos-smoke.result }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "CI scope selection did not complete successfully: $SCOPE_RESULT"
            exit 1
          fi
          if [ "$MODE" = "focused" ]; then
            for result in "$GLOBAL_RESULT" "$FOCUSED_RESULT"; do
              if [ "$result" != "success" ]; then
                echo "A required focused-tier job did not succeed: $result"
                exit 1
              fi
            done
            echo "Focused checks passed."
            exit 0
          fi
          if [ "$MODE" = "full" ]; then
            for result in "$UNIT_RESULT" "$WHEEL_RESULT" "$PROFILE_RESULT" "$SECURITY_RESULT" "$COVERAGE_RESULT" "$MACOS_RESULT"; do
              if [ "$result" != "success" ]; then
                echo "A required full-tier job did not succeed: $result"
                exit 1
              fi
            done
            echo "Full validation matrix passed."
            exit 0
          fi
          echo "Unknown CI mode: $MODE"
          exit 1
